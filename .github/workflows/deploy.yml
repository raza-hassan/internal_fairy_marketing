name: Deploy

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FAIRY_SSH_HOST }}
          username: ${{ secrets.FAIRY_SSH_USER }}
          key: ${{ secrets.FAIRY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.FAIRY_SSH_PORT }}
          script: |
            cd ~/www/staging.fairymarketing.com/public_html
            git pull origin dev
            php artisan config:clear
            php artisan cache:clear
            php artisan view:clear

  deploy-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Live
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FAIRY_SSH_HOST }}
          username: ${{ secrets.FAIRY_SSH_USER }}
          key: ${{ secrets.FAIRY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.FAIRY_SSH_PORT }}
          script: |
            echo "Live server not set up yet — skipping deploy. See runbook Phase 2 to set up the live server, then replace this script with the real path."
